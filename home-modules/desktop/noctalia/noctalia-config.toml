[plugins]
enabled = [ "aabidk20/yt-music", "dotnetrob/cat", "noctalia/umbriel-companion" ]

[shell]
settings_show_advanced = false

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "kitty", "umbriel" ]
    community_ids = [ "claude-code", "zen-browser", "vscode", "obs", "yazi" ]

[wallpaper]
directory = "/home/xvr6/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/xvr6/Pictures/Wallpapers/wallhaven_39wk99.jpg"

    [wallpaper.last]
    path = "/home/xvr6/Pictures/Wallpapers/wallhaven_39wk99.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/xvr6/Pictures/Wallpapers/wallhaven_39wk99.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/xvr6/Pictures/Wallpapers/wallhaven_39wk99.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/xvr6/Pictures/Wallpapers/wallhaven_4xryxd.jpg"

[widget.-]
length = 4
type = "spacer"

[widget.active_window]
show_empty_label = false

[widget.audio_visualizer]
bands = 112
capsule = true
capsule_padding = 4
capsule_radius = "auto"
color_1 = "secondary"
color_2 = "tertiary"
mirrored = false
scale = 0.9
show_when_idle = true
width = 210

[widget.battery]
display_mode = "graphic"
show_label = false

[widget.brightness]
show_label = false

[widget.cat]
cat_size = 28
run_threshold = 80
type = "dotnetrob/cat:cat"
walk_threshold = 25

    [widget.cat.actions]
    right = "panel-open control-center system"

[widget.clock]
font_scale = 0.95
scale = 0.95

[widget.control-center]
custom_image_colorize = true

[widget.date]
font_scale = 0.85
format = "{:%a %b %d}"
scale = 0.85

[widget.media]
album_art_only = true

    [widget.media.actions]
    right = "exec noctalia msg panel-toggle aabidk20/yt-music:panel"

[widget.network]
scale = 1.35
show_label = false

[widget.output_volume]
show_label = false

[widget.sysmon]
show_value = false

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.workspaces.actions]
right = "panel-toggle noctalia/umbriel-companion:panel"
