[widget.media]
album_art_only = true

[widget.media.actions]
right = "exec noctalia msg panel-toggle aabidk20/yt-music:panel"

[widget.network]
scale = 1.35
show_label = false

[widget.output_volume]
show_label = false

[widget.sysmon]
show_value = false

[widget.tray]
drawer = true

[widget.volume]
show_label = false
