[accessibility]
ui_scale = 1.25

[bar]
order = [ "Right" ]

    [bar.Right]
    capsule = true
    center = [ "media", "workspaces", "audio_visualizer" ]
    contact_shadow = true
    end = [ "group:g2", "group:g1" ]
    margin_ends = 0
    position = "right"
    radius = 28
    scale = 1.25
    start = [ "control-center", "notifications", "output_volume", "active_window" ]
    thickness = 42

        [[bar.Right.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "clock", "cat", "date" ]
        opacity = 1.0
        padding = 6.0

        [[bar.Right.capsule_group]]
        accordion = false
        accordion_direction = "start"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "tray", "battery" ]
        opacity = 1.0
        padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headset_dev_BC_3E_0B_21_04_D6"]
warning_threshold = 15

[calendar]

[control_center.calendar]
show_week_numbers = true

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen_widgets]
